<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Witherwood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
@keyframes rainfall {
  from { transform: translate3d(0, -120vh, 0) rotate(12deg); }
  to { transform: translate3d(-120px, 120vh, 0) rotate(12deg); }
}
.rain-overlay {
  position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 50; overflow: hidden;
}
.rain-drop {
  position: absolute; top: -20%; width: 3px; height: 40px; border-radius: 9999px;
  background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(220,238,255,0.7));
  animation: rainfall linear infinite; will-change: transform;
}

@keyframes shootingStar {
  0% { transform: translate3d(0, 0, 0) rotate(25deg); opacity: 0; }
  8% { opacity: 1; }
  65% { opacity: 1; }
  100% { transform: translate3d(400px, 200px, 0) rotate(25deg); opacity: 0; }
}
.night-overlay {
  position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 50; overflow: hidden;
}
.shooting-star {
  position: absolute; width: 120px; height: 2px; border-radius: 9999px;
  background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,1));
  box-shadow: 0 0 10px rgba(255,255,255,0.8);
  animation: shootingStar 3s ease-out forwards;
}

@keyframes leafFloat {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translate(150px, 110vh) rotate(360deg); opacity: 0; }
}
.forest-overlay {
    position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 50; overflow: hidden;
}
.falling-leaf {
    position: absolute; top: -10%; width: 24px; height: 24px;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2322c55e"><path d="M17 8C8 10 5.9 16.17 3.82 21.5L5.71 22L6.66 19.7C7.14 19.87 7.64 20 8 20C19 20 22 3 22 3C21 5 14 5.25 9 6.25C4 7.25 2 11.5 2 13.5C2 15.5 3.75 17.25 3.75 17.25C7 8 17 8 17 8Z"/></svg>');
    background-size: contain; background-repeat: no-repeat; opacity: 0;
    animation: leafFloat linear forwards; will-change: transform, opacity;
}

.brand-title { font-family: 'Cinzel', serif; letter-spacing: 0.08em; font-weight: 700; }
.brand-title-night { text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6), 0 0 20px rgba(167, 139, 250, 0.4); }
.brand-title-rain { text-shadow: 0 2px 10px rgba(15, 23, 42, 0.2), 0 0 20px rgba(14, 165, 233, 0.3); }

/* Mini Player Styles */
#miniPlayer {
  display: none; position: fixed; bottom: 24px; right: 24px; width: 140px; height: 140px;
  border-radius: 50%; background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
  z-index: 9999; cursor: pointer; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
#miniPlayer:hover { transform: scale(1.05); }
#miniPlayer.hidden-mini { opacity: 0; pointer-events: none; transform: scale(0.5); }
#miniPlayer.visible-mini { opacity: 1; pointer-events: auto; transform: scale(1); display: flex; }

.mini-ring-container { position: absolute; inset: 0; width: 100%; height: 100%; }
.mini-ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.mini-ring-bg { fill: none; stroke: rgba(255, 255, 255, 0.2); stroke-width: 6; }
.mini-ring-progress {
    fill: none; stroke: #10b981; stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: 376.99; /* 2 * pi * 60 */ stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.2s linear, stroke 0.3s ease;
}
.mini-timer-text { font-family: monospace; font-size: 1.75rem; font-weight: bold; z-index: 10; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
.mini-phase-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; z-index: 10; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }

/* PC Scrollbar styles */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: rgba(107, 114, 128, 0.8); }
</style>
</head>
<body class="min-h-screen bg-gradient-to-b from-emerald-50 via-lime-50 to-teal-100 text-slate-800 transition-colors duration-700 overflow-x-hidden font-sans selection:bg-emerald-200 selection:text-emerald-900" id="bodyElement">

<!-- Visual Effects Overlays -->
<div id="rainOverlay" class="rain-overlay hidden"></div>
<div id="nightOverlay" class="night-overlay hidden"></div>
<div id="forestOverlay" class="forest-overlay hidden"></div>

<div class="min-h-screen p-4 md:p-8 flex flex-col items-center justify-center transition-colors duration-700">
  <div id="appRoot" class="w-full max-w-4xl min-h-[85vh] rounded-[2.5rem] bg-white/40 backdrop-blur-xl border border-white/50 shadow-2xl p-6 md:p-10 transition-all duration-700 relative overflow-hidden">
    
    <header class="relative flex flex-col items-center justify-center text-center w-full mb-8 pt-2">
      <div>
        <h1 id="brandTitle" class="brand-title text-2xl md:text-3xl uppercase tracking-widest flex items-center justify-center gap-3 transition-colors duration-300">
          <span class="text-3xl" id="brandIcon">🌲</span> WITHERWOOD
        </h1>
        <p id="brandSubtitle" class="text-slate-600 mt-2 text-sm md:text-base font-medium transition-colors duration-300">Every 10 minutes of focus plants a tree.</p>
      </div>
      
      <div class="absolute top-0 right-0 flex gap-3">
        <button id="miniPlayerToggleBtn" class="w-12 h-12 rounded-2xl border border-slate-200/80 bg-white/80 hover:bg-white flex items-center justify-center text-slate-600 transition-all shadow-sm hover:shadow-md" title="Pop-out Mini Player">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
        </button>
        <button id="fullscreenBtn" class="w-12 h-12 rounded-2xl border border-slate-200/80 bg-white/80 hover:bg-white flex items-center justify-center text-slate-600 transition-all shadow-sm hover:shadow-md" title="Toggle Fullscreen">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
        </button>
      </div>
    </header>

    <nav id="nav" class="flex flex-wrap justify-center gap-3 md:gap-4 mb-8"></nav>

    <section id="focusPage" class="rounded-[2rem] bg-white border border-slate-100 shadow-xl p-8 md:p-12 max-w-2xl mx-auto transition-all duration-500 transform origin-top">
      <div class="max-w-lg mx-auto text-center">
        <div id="phaseLabel" class="text-lg font-bold uppercase tracking-wider text-emerald-600 transition-colors duration-300 mb-4">Focus Session</div>

        <div class="flex justify-center">
          <div class="relative w-[20rem] h-[20rem] md:w-[24rem] md:h-[24rem] my-2">
            <svg class="w-full h-full -rotate-90" viewBox="0 0 180 180">
              <circle id="progressRingBg" cx="90" cy="90" r="84" fill="none" stroke="#ecfdf5" stroke-width="8" class="transition-colors duration-500" />
              <circle
                id="progressRing"
                cx="90"
                cy="90"
                r="84"
                fill="none"
                stroke="#10b981"
                stroke-width="8"
                stroke-linecap="round"
                stroke-dasharray="527.78"
                stroke-dashoffset="0"
                class="transition-colors duration-500 transition-[stroke-dashoffset] duration-200 linear"
              />
            </svg>

            <div class="absolute inset-0 flex flex-col items-center justify-center">
              <div id="timer" class="text-6xl md:text-7xl font-bold tracking-tight text-slate-800 transition-colors duration-300">25:00</div>
              <div id="progressLabel" class="mt-4 text-lg font-medium text-slate-500 transition-colors duration-300 flex items-center justify-center gap-2"></div>
            </div>
          </div>
        </div>

        <div id="focusControls" class="mt-8 flex flex-col items-center justify-center gap-5">
          <div class="flex items-center gap-4 bg-slate-50 px-6 py-3 rounded-2xl border border-slate-100 transition-colors duration-300" id="durationControlContainer">
            <label class="font-semibold text-slate-700 transition-colors duration-300" id="durationLabel">Focus (min)</label>
            <input
              id="focusMinutesInput"
              type="number"
              min="1"
              max="180"
              value="25"
              class="w-24 rounded-xl border-2 border-emerald-200 px-3 py-2 text-center text-lg font-bold text-emerald-700 transition-colors duration-300 focus:outline-none focus:border-emerald-500 bg-white"
            />
          </div>
          <div id="saplings" class="text-lg font-bold transition-colors duration-300 flex items-center justify-center gap-2"></div>
        </div>

        <div class="flex flex-wrap justify-center gap-4 mt-10">
          <button id="startPauseBtn" class="px-10 py-4 rounded-full bg-emerald-500 text-white text-lg font-bold shadow-lg shadow-emerald-500/30 transition-all duration-300 hover:bg-emerald-600 hover:-translate-y-1">Start</button>
          <button id="witherBtn" class="px-8 py-4 rounded-full bg-amber-500 text-white text-lg font-bold shadow-lg shadow-amber-500/30 transition-all duration-300 hover:bg-amber-600 hover:-translate-y-1 hidden">🍂 Give Up</button>
          <button id="resetBtn" class="px-8 py-4 rounded-full border-2 border-slate-200 bg-white text-slate-600 text-lg font-bold shadow-sm transition-colors duration-300 hover:bg-slate-50 hover:text-slate-800">Reset</button>
        </div>

        <p id="message" class="mt-8 text-lg italic text-slate-500 transition-colors duration-300">“A calm mind nurtures strong roots.”</p>
      </div>
    </section>

    <section id="forestPage" class="hidden rounded-[2rem] bg-white border border-slate-100 shadow-xl p-8 md:p-12 max-w-4xl mx-auto transition-all duration-500">
      <h2 class="text-3xl font-bold mb-4 text-emerald-800 transition-colors duration-300" id="forestTitle">Your Forest</h2>
      <div id="forestSummary" class="text-lg font-medium text-slate-600 mb-8 transition-colors duration-300"></div>
      <div id="forestGrid" class="flex flex-wrap gap-3 text-3xl p-6 bg-slate-50 rounded-3xl min-h-[200px] border border-slate-100 transition-colors duration-300"></div>
    </section>

    <section id="dashboardPage" class="hidden max-w-4xl mx-auto">
      <div id="dashboardGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>

    <section id="settingsPage" class="hidden rounded-[2rem] bg-white border border-slate-100 shadow-xl p-8 md:p-12 max-w-2xl mx-auto space-y-8 transition-all duration-500">
      <h2 class="text-3xl font-bold text-emerald-800 transition-colors duration-300" id="settingsTitle">Settings</h2>

      <div class="grid md:grid-cols-2 gap-8">
        <div class="space-y-6">
          <label class="block">
            <span class="font-bold text-slate-700 transition-colors duration-300" id="themeLabel">Visual Theme</span>
            <select id="themeSelect" class="w-full mt-2 rounded-xl border-2 border-slate-200 px-4 py-3 text-lg font-medium transition-colors duration-300 focus:border-emerald-500 focus:outline-none">
              <option value="forest">🌲 Forest</option>
              <option value="night">🌙 Night</option>
              <option value="rain">🌧️ Rain</option>
            </select>
            <p class="text-sm text-slate-500 mt-1">Changes visual aesthetics.</p>
          </label>

          <label class="block">
            <span class="font-bold text-slate-700 transition-colors duration-300" id="soundscapeLabel">Soundscape</span>
            <select id="soundscapeSelect" class="w-full mt-2 rounded-xl border-2 border-slate-200 px-4 py-3 text-lg font-medium transition-colors duration-300 focus:border-emerald-500 focus:outline-none">
              <option value="woodland">🌲 Woodland</option>
              <option value="rain">🌧️ Rain</option>
              <option value="fireside">🔥 Fireside</option>
              <option value="none">🔇 None</option>
            </select>
            <p class="text-sm text-slate-500 mt-1">Background ambient audio.</p>
          </label>
          
          <label class="block">
            <div class="flex items-center justify-between mb-2">
              <span class="font-bold text-slate-700 transition-colors duration-300" id="volumeLabel">Audio Volume</span>
              <span id="ambientVolumeLabel" class="text-sm font-bold text-emerald-600">50%</span>
            </div>
            <input id="ambientVolumeInput" type="range" min="0" max="100" step="1" value="50" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-500" />
          </label>
        </div>

        <div class="space-y-6">
          <div class="flex items-center gap-4 bg-slate-50 p-4 rounded-xl border border-slate-100 transition-colors duration-300" id="breakToggleContainer">
            <input id="breaksEnabledToggle" type="checkbox" class="w-6 h-6 rounded text-emerald-500 focus:ring-emerald-500 cursor-pointer" />
            <span class="font-bold text-slate-700 transition-colors duration-300" id="breakToggleLabel">Enable Break Sessions</span>
          </div>

          <label class="block">
            <span class="font-bold text-slate-700 transition-colors duration-300" id="breakMinLabel">Break Minutes</span>
            <input id="breakMinutesInput" type="number" min="1" max="60" value="5" class="w-full mt-2 rounded-xl border-2 border-slate-200 px-4 py-3 text-lg font-bold transition-colors duration-300 focus:border-emerald-500 focus:outline-none" />
          </label>
        </div>
      </div>

      <div class="pt-6 border-t-2 border-slate-100 space-y-4">
        <h3 class="font-bold text-xl text-slate-700 transition-colors duration-300" id="dataTitle">Data Management</h3>
        <div class="flex gap-3 flex-wrap">
          <button id="exportDataBtn" class="px-5 py-3 rounded-xl bg-slate-800 text-white font-semibold hover:bg-slate-700 transition shadow-md">📤 Export Backup</button>
          <button id="importDataBtn" class="px-5 py-3 rounded-xl bg-slate-600 text-white font-semibold hover:bg-slate-500 transition shadow-md">📥 Import</button>
          <button id="resetAllBtn" class="px-5 py-3 rounded-xl bg-rose-500 text-white font-semibold hover:bg-rose-600 transition shadow-md ml-auto">Reset Forest</button>
          <input id="importFileInput" type="file" accept=".json" style="display:none" />
        </div>
      </div>
    </section>
  </div>
</div>

<!-- Mini Player -->
<div id="miniPlayer" class="hidden-mini text-white" aria-label="Return to App" title="Click to maximize">
    <div class="mini-phase-label" id="miniPhaseLabel">Focus</div>
    <div class="mini-timer-text" id="miniTimer">25:00</div>
    <div class="mini-ring-container">
        <svg class="mini-ring-svg" viewBox="0 0 132 132">
            <circle class="mini-ring-bg" cx="66" cy="66" r="60" id="miniRingBg"></circle>
            <circle class="mini-ring-progress" cx="66" cy="66" r="60" id="miniRingProgress"></circle>
        </svg>
    </div>
</div>

<script>
// --- State & Defaults ---
const STORAGE_KEY = 'witherwood-data';
const DEFAULTS = {
  focusMinutes: 25,
  breakMinutes: 5,
  theme: 'forest',
  soundscape: 'woodland',
  ambientVolume: 50,
  livingTrees: 0,
  deadTrees: 0,
  totalFocusMinutes: 0,
  todayFocusMinutes: 0,
  streakDays: 0,
  bestDayMinutes: 0,
  lastFocusDate: '',
  breaksEnabled: true,
};

let data = { ...DEFAULTS, ...(JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}')) };

// Ensure data integrity for older saves
if (!data.soundscape) data.soundscape = data.ambientSoundEnabled ? 'woodland' : 'none';

let page = 'focus';
let phase = 'focus'; // 'focus' or 'break'
let isRunning = false;
let timerInterval = null;
let secondsLeft = data.focusMinutes * 60;
let targetEndTime = 0; // Crucial for PC background throttling fix
let healthyTrees = calculateTrees(data.focusMinutes);
let effectInterval = null;

const pages = ['focus', 'forest', 'dashboard', 'settings'];
const labels = { focus: '⏱ Focus', forest: '🌲 Forest', dashboard: '📊 Dashboard', settings: '⚙️ Settings' };

// --- Theme Configurations ---
const themes = {
  forest: {
    bg: ['from-emerald-50', 'via-lime-50', 'to-teal-100'],
    cardBg: 'bg-white',
    textMain: 'text-slate-800',
    textMuted: 'text-slate-500',
    textAccent: 'text-emerald-800',
    borderColor: 'border-slate-100',
    ringColor: '#10b981', ringBg: '#ecfdf5',
    btnPrimary: 'bg-emerald-500 hover:bg-emerald-600 text-white',
    navActive: 'bg-emerald-500 text-white shadow-md border-transparent',
    navInactive: 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50',
    icon: '🌲', effect: 'leaves'
  },
  night: {
    bg: ['from-slate-900', 'via-slate-800', 'to-indigo-950'],
    cardBg: 'bg-slate-800/90 backdrop-blur-md',
    textMain: 'text-slate-100',
    textMuted: 'text-slate-400',
    textAccent: 'text-indigo-300',
    borderColor: 'border-slate-700',
    ringColor: '#818cf8', ringBg: 'rgba(129, 140, 248, 0.2)',
    btnPrimary: 'bg-indigo-500 hover:bg-indigo-600 text-white',
    navActive: 'bg-indigo-500 text-white shadow-md border-transparent',
    navInactive: 'bg-slate-800 text-slate-300 border-slate-700 hover:bg-slate-700',
    icon: '🌙', effect: 'stars'
  },
  rain: {
    bg: ['from-slate-300', 'via-slate-400', 'to-zinc-500'],
    cardBg: 'bg-white/80 backdrop-blur-md',
    textMain: 'text-slate-800',
    textMuted: 'text-slate-600',
    textAccent: 'text-sky-800',
    borderColor: 'border-white/40',
    ringColor: '#0ea5e9', ringBg: 'rgba(14, 165, 233, 0.2)',
    btnPrimary: 'bg-sky-500 hover:bg-sky-600 text-white',
    navActive: 'bg-sky-500 text-white shadow-md border-transparent',
    navInactive: 'bg-white/60 text-slate-700 border-white/50 hover:bg-white/90',
    icon: '🌧️', effect: 'rain'
  }
};

// --- DOM Elements ---
const body = document.getElementById('bodyElement');
const appRoot = document.getElementById('appRoot');
const navEl = document.getElementById('nav');
const timerEl = document.getElementById('timer');
const progressRing = document.getElementById('progressRing');
const progressRingBg = document.getElementById('progressRingBg');
const progressLabel = document.getElementById('progressLabel');
const saplingsEl = document.getElementById('saplings');
const startPauseBtn = document.getElementById('startPauseBtn');
const witherBtn = document.getElementById('witherBtn');
const resetBtn = document.getElementById('resetBtn');
const messageEl = document.getElementById('message');
const phaseLabel = document.getElementById('phaseLabel');
const focusMinutesInput = document.getElementById('focusMinutesInput');
const brandTitle = document.getElementById('brandTitle');
const brandIcon = document.getElementById('brandIcon');
const miniPlayerToggleBtn = document.getElementById('miniPlayerToggleBtn');
const miniPlayer = document.getElementById('miniPlayer');
const fullscreenBtn = document.getElementById('fullscreenBtn');

// --- Audio System ---
// Uses Web Audio API Context combined with HTMLAudioElements for reliable cross-browser playback
const audioSources = {
    woodland: 'https://cdn.freesound.org/previews/515/515286_11306342-lq.mp3', // birds/forest
    rain: 'https://cdn.freesound.org/previews/531/531947_11202868-lq.mp3', // steady rain
    fireside: 'https://cdn.freesound.org/previews/435/435238_8963364-lq.mp3' // fire crackle
};

const audioElements = {};
let activeAudio = null;

function setupAudio() {
    for (const [key, src] of Object.entries(audioSources)) {
        const audio = new Audio(src);
        audio.loop = true;
        audio.volume = data.ambientVolume / 100;
        audioElements[key] = audio;
    }
}

function playAmbientAudio() {
    if (data.soundscape === 'none' || !isRunning) return;
    const targetAudio = audioElements[data.soundscape];
    
    // Pause others
    Object.values(audioElements).forEach(a => {
        if (a !== targetAudio && !a.paused) a.pause();
    });

    if (targetAudio && targetAudio.paused) {
        // Promise catch to handle Chrome's autoplay policy gracefully
        targetAudio.play().catch(e => {
            console.log("Audio play blocked by browser policy. Requires user interaction.", e);
        });
        activeAudio = targetAudio;
    }
}

function stopAmbientAudio() {
    if (activeAudio) {
        activeAudio.pause();
        activeAudio = null;
    }
}

function updateAudioVolume() {
    const vol = data.ambientVolume / 100;
    Object.values(audioElements).forEach(a => a.volume = vol);
}

// --- Timer Logic (Fixed for Background Tab Throttling) ---
function calculateTrees(minutes) {
    return Math.max(1, Math.ceil(minutes / 10));
}

function toggleTimer() {
    if (isRunning) {
        // Pause
        isRunning = false;
        clearInterval(timerInterval);
        startPauseBtn.textContent = 'Resume';
        witherBtn.classList.remove('hidden');
        stopAmbientAudio();
    } else {
        // Start
        isRunning = true;
        startPauseBtn.textContent = 'Pause';
        witherBtn.classList.remove('hidden');
        focusMinutesInput.disabled = true;
        
        // Calculate absolute end time to prevent background throttling desync
        targetEndTime = Date.now() + (secondsLeft * 1000);
        
        // Run interval frequently for smooth UI updates
        timerInterval = setInterval(updateTimerTick, 200); 
        
        playAmbientAudio(); // Calling play within a click event satisfies Autoplay policies!
    }
}

function updateTimerTick() {
    const now = Date.now();
    
    if (now >= targetEndTime) {
        // Timer finished
        secondsLeft = 0;
        updateDisplay();
        completePhase();
    } else {
        // Calculate remaining seconds based on absolute time
        secondsLeft = Math.ceil((targetEndTime - now) / 1000);
        updateDisplay();
    }
}

function completePhase() {
    clearInterval(timerInterval);
    isRunning = false;
    stopAmbientAudio();
    
    if (phase === 'focus') {
        const gained = healthyTrees;
        data.livingTrees += gained;
        data.totalFocusMinutes += data.focusMinutes;
        updateDailyStats(data.focusMinutes);
        saveData();
        
        // Browser Notification if supported
        if (Notification.permission === 'granted') {
            new Notification('Session Complete!', { body: `You planted ${gained} tree(s)!` });
        }
        
        if (data.breaksEnabled) {
            startPhase('break');
            // Auto-start break
            setTimeout(() => { toggleTimer(); }, 1000); 
        } else {
            resetTimer();
            messageEl.textContent = `Great job! Planted ${gained} tree(s).`;
        }
    } else {
        // Break finished
        if (Notification.permission === 'granted') {
            new Notification('Break Over', { body: 'Time to refocus and plant more trees!' });
        }
        startPhase('focus');
        messageEl.textContent = "Ready to plant another tree?";
    }
}

function startPhase(newPhase) {
    phase = newPhase;
    isRunning = false;
    clearInterval(timerInterval);
    stopAmbientAudio();
    
    if (phase === 'focus') {
        secondsLeft = data.focusMinutes * 60;
        phaseLabel.textContent = 'Focus Session';
        witherBtn.classList.add('hidden');
        focusMinutesInput.disabled = false;
        startPauseBtn.textContent = 'Start';
        startPauseBtn.className = `px-10 py-4 rounded-full text-white text-lg font-bold shadow-lg transition-all duration-300 hover:-translate-y-1 ${themes[data.theme].btnPrimary}`;
    } else {
        secondsLeft = data.breakMinutes * 60;
        phaseLabel.textContent = 'Rest & Recover';
        witherBtn.classList.add('hidden');
        focusMinutesInput.disabled = true;
        startPauseBtn.textContent = 'Start Break';
        startPauseBtn.className = `px-10 py-4 rounded-full bg-blue-500 hover:bg-blue-600 text-white text-lg font-bold shadow-lg shadow-blue-500/30 transition-all duration-300 hover:-translate-y-1`;
    }
    updateDisplay();
}

function resetTimer() {
    startPhase(phase);
}

function witherTree() {
    if (!confirm("Are you sure you want to give up? The trees you were planting will wither.")) return;
    
    data.deadTrees += healthyTrees;
    saveData();
    resetTimer();
    messageEl.textContent = "The saplings withered. Try again when you're ready.";
}

function updateDisplay() {
    const totalSeconds = phase === 'focus' ? data.focusMinutes * 60 : data.breakMinutes * 60;
    const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
    const s = (secondsLeft % 60).toString().padStart(2, '0');
    const timeString = `${m}:${s}`;
    
    timerEl.textContent = timeString;
    document.title = isRunning ? `${timeString} - Witherwood` : 'Witherwood';

    // SVG Ring Progress
    const radius = 84;
    const circumference = radius * 2 * Math.PI; // ~527.78
    const percent = secondsLeft / totalSeconds;
    const offset = circumference - (percent * circumference);
    progressRing.style.strokeDashoffset = offset;

    // Mini Player Sync
    const miniRingRadius = 60;
    const miniCircumference = miniRingRadius * 2 * Math.PI;
    document.getElementById('miniTimer').textContent = timeString;
    document.getElementById('miniPhaseLabel').textContent = phase;
    document.getElementById('miniRingProgress').style.strokeDashoffset = miniCircumference - (percent * miniCircumference);

    if (phase === 'focus') {
        const planted = healthyTrees - Math.ceil((secondsLeft / 60) / 10);
        const growing = healthyTrees - planted;
        progressLabel.innerHTML = `<span>⏳ ${m}m remaining</span>`;
        saplingsEl.innerHTML = `${'🌲'.repeat(Math.max(0, planted))}${'🌱'.repeat(Math.max(0, growing))}`;
        
        // Mini player color mapping
        document.getElementById('miniRingProgress').style.stroke = themes[data.theme].ringColor;
        document.getElementById('miniPlayer').style.background = themes[data.theme].ringBg.replace('0.2', '0.8');
    } else {
        progressLabel.innerHTML = `<span>☕ Resting</span>`;
        saplingsEl.innerHTML = '';
        document.getElementById('miniRingProgress').style.stroke = '#3b82f6'; // blue for break
        document.getElementById('miniPlayer').style.background = 'rgba(59, 130, 246, 0.8)';
    }
}

// Mini Player Toggle Logic
let isMiniPlayerActive = false;
function toggleMiniPlayer() {
    isMiniPlayerActive = !isMiniPlayerActive;
    if (isMiniPlayerActive) {
        miniPlayer.classList.remove('hidden-mini');
        miniPlayer.classList.add('visible-mini');
        document.getElementById('focusPage').style.opacity = '0.3';
        document.getElementById('focusPage').style.pointerEvents = 'none';
        
        // Request visual PIP if browser supports generic Document PIP (rare, but good fallback)
        if ('documentPictureInPicture' in window) {
           // Complex implementation skipped for stability; using custom floating div instead.
        }
    } else {
        miniPlayer.classList.add('hidden-mini');
        miniPlayer.classList.remove('visible-mini');
        document.getElementById('focusPage').style.opacity = '1';
        document.getElementById('focusPage').style.pointerEvents = 'auto';
    }
}

miniPlayerToggleBtn.addEventListener('click', toggleMiniPlayer);
miniPlayer.addEventListener('click', toggleMiniPlayer);

// Fullscreen API (Requires user interaction)
fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
            console.log(`Error attempting to enable fullscreen: ${err.message}`);
        });
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
});

// --- Themes & Effects ---
function applyTheme() {
    const t = themes[data.theme];
    
    // Background and base text
    body.className = `min-h-screen bg-gradient-to-b ${t.bg.join(' ')} ${t.textMain} transition-colors duration-700 overflow-x-hidden font-sans selection:bg-emerald-200 selection:text-emerald-900`;
    
    // App Container
    appRoot.className = `w-full max-w-4xl min-h-[85vh] rounded-[2.5rem] ${t.cardBg} border ${t.borderColor} shadow-2xl p-6 md:p-10 transition-all duration-700 relative overflow-hidden`;

    // Titles
    brandIcon.textContent = t.icon;
    brandTitle.className = `brand-title text-2xl md:text-3xl uppercase tracking-widest flex items-center justify-center gap-3 transition-colors duration-300 ${t.textMain}`;
    if (data.theme === 'night') brandTitle.classList.add('brand-title-night');
    if (data.theme === 'rain') brandTitle.classList.add('brand-title-rain');
    
    document.getElementById('brandSubtitle').className = `mt-2 text-sm md:text-base font-medium transition-colors duration-300 ${t.textMuted}`;
    
    // Section styles
    ['focusPage', 'forestPage', 'settingsPage'].forEach(id => {
        const el = document.getElementById(id);
        if(el) {
            el.className = el.className.replace(/bg-[\w/-]+/, t.cardBg.split(' ')[0]);
            el.className = el.className.replace(/border-[\w/-]+/, t.borderColor);
        }
    });

    // Typography overrides
    phaseLabel.className = `text-lg font-bold uppercase tracking-wider transition-colors duration-300 mb-4 ${t.textAccent}`;
    timerEl.className = `text-6xl md:text-7xl font-bold tracking-tight transition-colors duration-300 ${t.textMain}`;
    progressLabel.className = `mt-4 text-lg font-medium transition-colors duration-300 flex items-center justify-center gap-2 ${t.textMuted}`;
    
    // Progress Ring colors
    progressRing.style.stroke = t.ringColor;
    progressRingBg.style.stroke = t.ringBg;

    // Button colors (if not in break)
    if (phase === 'focus') {
        startPauseBtn.className = `px-10 py-4 rounded-full text-white text-lg font-bold shadow-lg transition-all duration-300 hover:-translate-y-1 ${t.btnPrimary}`;
    }

    renderNav();
    applyVisualEffects();
    
    // Update Theme select UI
    document.getElementById('themeSelect').value = data.theme;
}

function applyVisualEffects() {
    // Clear all existing
    clearInterval(effectInterval);
    document.getElementById('rainOverlay').innerHTML = '';
    document.getElementById('nightOverlay').innerHTML = '';
    document.getElementById('forestOverlay').innerHTML = '';
    document.getElementById('rainOverlay').classList.add('hidden');
    document.getElementById('nightOverlay').classList.add('hidden');
    document.getElementById('forestOverlay').classList.add('hidden');

    // Only apply if tab is visible to save PC CPU
    if (document.hidden) return;

    if (data.theme === 'rain') {
        const overlay = document.getElementById('rainOverlay');
        overlay.classList.remove('hidden');
        createRainDrops(overlay);
    } else if (data.theme === 'night') {
        const overlay = document.getElementById('nightOverlay');
        overlay.classList.remove('hidden');
        effectInterval = setInterval(() => createShootingStar(overlay), 4000);
    } else if (data.theme === 'forest') {
        const overlay = document.getElementById('forestOverlay');
        overlay.classList.remove('hidden');
        effectInterval = setInterval(() => createLeaf(overlay), 3000);
    }
}

// Pause effects when tab is hidden, resume when visible
document.addEventListener('visibilitychange', () => {
    applyVisualEffects();
});

function createRainDrops(container) {
    const fragment = document.createDocumentFragment();
    // Reduce density slightly for PC performance
    for (let i = 0; i < 70; i++) { 
        const drop = document.createElement('div');
        drop.className = 'rain-drop';
        drop.style.left = `${Math.random() * 120 - 10}%`;
        drop.style.animationDuration = `${Math.random() * 0.4 + 0.4}s`;
        drop.style.animationDelay = `${Math.random() * 2}s`;
        fragment.appendChild(drop);
    }
    container.appendChild(fragment);
}

function createShootingStar(container) {
    if(document.hidden) return;
    const star = document.createElement('div');
    star.className = 'shooting-star';
    star.style.top = `${Math.random() * 40}%`;
    star.style.left = `${Math.random() * 60}%`;
    container.appendChild(star);
    setTimeout(() => star.remove(), 3000);
}

function createLeaf(container) {
    if(document.hidden) return;
    const leaf = document.createElement('div');
    leaf.className = 'falling-leaf';
    leaf.style.left = `${Math.random() * 90}%`;
    leaf.style.animationDuration = `${Math.random() * 4 + 6}s`;
    
    const size = Math.random() * 15 + 15;
    leaf.style.width = `${size}px`;
    leaf.style.height = `${size}px`;
    
    container.appendChild(leaf);
    setTimeout(() => leaf.remove(), 10000);
}

// --- Navigation & Routing ---
function setPage(newPage) {
    page = newPage;
    pages.forEach(p => {
        const el = document.getElementById(`${p}Page`);
        if(el) el.classList.toggle('hidden', p !== page);
    });
    renderNav();
    if (page === 'forest') renderForest();
    if (page === 'dashboard') renderDashboard();
}

function renderNav() {
    const t = themes[data.theme];
    navEl.innerHTML = pages.map(p => `
        <button onclick="setPage('${p}')" class="px-5 py-2.5 rounded-2xl font-bold transition-all shadow-sm ${page === p ? t.navActive : t.navInactive}">
            ${labels[p]}
        </button>
    `).join('');
}

// --- Data & Stats ---
function updateDailyStats(minutes) {
    const today = new Date().toDateString();
    if (data.lastFocusDate !== today) {
        if (data.lastFocusDate === new Date(Date.now() - 86400000).toDateString()) {
            data.streakDays++;
        } else {
            data.streakDays = 1;
        }
        data.todayFocusMinutes = 0;
        data.lastFocusDate = today;
    }
    data.todayFocusMinutes += minutes;
    if (data.todayFocusMinutes > data.bestDayMinutes) {
        data.bestDayMinutes = data.todayFocusMinutes;
    }
}

function saveData() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// --- Specific Pages Renderers ---
function renderForest() {
    document.getElementById('forestSummary').innerHTML = `
        <div class="flex gap-6 mb-4">
            <div class="bg-emerald-50 px-4 py-3 rounded-xl border border-emerald-100 text-emerald-800">
                <span class="text-2xl font-bold">${data.livingTrees}</span> <br/>Living Trees
            </div>
            <div class="bg-amber-50 px-4 py-3 rounded-xl border border-amber-100 text-amber-800">
                <span class="text-2xl font-bold">${data.deadTrees}</span> <br/>Withered Saplings
            </div>
        </div>
        <p>Your forest represents your dedication. Keep focusing to grow it further!</p>
    `;
    
    const grid = document.getElementById('forestGrid');
    grid.innerHTML = '';
    
    if(data.livingTrees === 0 && data.deadTrees === 0) {
        grid.innerHTML = '<div class="w-full text-center text-slate-400 py-10 text-lg">Your forest is empty. Start a session to plant your first tree!</div>';
        return;
    }

    const docFrag = document.createDocumentFragment();
    
    for (let i = 0; i < data.livingTrees; i++) {
        const treeTypes = ['🌲', '🌳', '🌴', '🎍'];
        const type = treeTypes[Math.floor(Math.random() * treeTypes.length)];
        const span = document.createElement('span');
        span.className = 'transform hover:scale-125 transition-transform cursor-default inline-block';
        span.textContent = type;
        docFrag.appendChild(span);
    }
    for (let i = 0; i < data.deadTrees; i++) {
        const span = document.createElement('span');
        span.className = 'opacity-60 grayscale transform hover:scale-110 transition-transform cursor-default inline-block';
        span.textContent = '🍂';
        docFrag.appendChild(span);
    }
    
    grid.appendChild(docFrag);
}

function renderDashboard() {
    const stats = [
        { label: 'Total Focus', value: `${Math.floor(data.totalFocusMinutes / 60)}h ${data.totalFocusMinutes % 60}m`, icon: '⏱' },
        { label: 'Today', value: `${data.todayFocusMinutes}m`, icon: '📅' },
        { label: 'Current Streak', value: `${data.streakDays} Days`, icon: '🔥' },
        { label: 'Best Day', value: `${data.bestDayMinutes}m`, icon: '🏆' },
        { label: 'Forest Size', value: data.livingTrees, icon: '🌲' },
        { label: 'Survival Rate', value: `${data.livingTrees + data.deadTrees > 0 ? Math.round((data.livingTrees / (data.livingTrees + data.deadTrees)) * 100) : 0}%`, icon: '📊' },
    ];

    const t = themes[data.theme];
    document.getElementById('dashboardGrid').innerHTML = stats.map(s => `
        <div class="${t.cardBg} rounded-3xl p-6 border ${t.borderColor} shadow-lg flex items-center gap-4 transition-all duration-300 hover:translate-y-[-2px]">
            <div class="text-4xl bg-slate-50/50 p-4 rounded-2xl border border-slate-100">${s.icon}</div>
            <div>
                <div class="text-sm font-bold uppercase tracking-wider ${t.textMuted}">${s.label}</div>
                <div class="text-2xl font-bold ${t.textMain}">${s.value}</div>
            </div>
        </div>
    `).join('');
}

// --- Event Listeners Setup ---
startPauseBtn.addEventListener('click', () => {
    // Required for web audio API to start on some browsers
    if (Notification.permission === 'default') {
        Notification.requestPermission();
    }
    toggleTimer();
});

witherBtn.addEventListener('click', witherTree);
resetBtn.addEventListener('click', () => {
    if (confirm("Reset current timer?")) resetTimer();
});

focusMinutesInput.addEventListener('change', (e) => {
    let val = parseInt(e.target.value);
    if (isNaN(val) || val < 1) val = 1;
    if (val > 180) val = 180;
    e.target.value = val;
    data.focusMinutes = val;
    healthyTrees = calculateTrees(val);
    saveData();
    if (!isRunning && phase === 'focus') resetTimer();
});

// Settings Events
document.getElementById('themeSelect').addEventListener('change', (e) => {
    data.theme = e.target.value;
    saveData();
    applyTheme();
});

document.getElementById('soundscapeSelect').addEventListener('change', (e) => {
    data.soundscape = e.target.value;
    saveData();
    if (isRunning) {
        stopAmbientAudio();
        playAmbientAudio();
    }
});

document.getElementById('ambientVolumeInput').addEventListener('input', (e) => {
    data.ambientVolume = e.target.value;
    document.getElementById('ambientVolumeLabel').textContent = `${data.ambientVolume}%`;
    updateAudioVolume();
    saveData();
});

document.getElementById('breaksEnabledToggle').addEventListener('change', (e) => {
    data.breaksEnabled = e.target.checked;
    saveData();
});

document.getElementById('breakMinutesInput').addEventListener('change', (e) => {
    let val = parseInt(e.target.value);
    if (isNaN(val) || val < 1) val = 1;
    e.target.value = val;
    data.breakMinutes = val;
    saveData();
    if (!isRunning && phase === 'break') resetTimer();
});

document.getElementById('resetAllBtn').addEventListener('click', () => {
    if (confirm("WARNING: This will permanently delete your forest and all statistics. Continue?")) {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
    }
});

// Import/Export
document.getElementById('exportDataBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `witherwood_backup_${new Date().toISOString().split('T')[0]}.json`;
    a.click();
    URL.revokeObjectURL(url);
});

document.getElementById('importDataBtn').addEventListener('click', () => {
    document.getElementById('importFileInput').click();
});

document.getElementById('importFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const imported = JSON.parse(e.target.result);
            if (imported && typeof imported === 'object') {
                data = { ...DEFAULTS, ...imported };
                saveData();
                alert("Data imported successfully!");
                location.reload();
            }
        } catch (err) {
            alert("Invalid backup file.");
        }
    };
    reader.readAsText(file);
});

// --- Boot Sequence ---
function init() {
    setupAudio();
    
    // Sync UI with data
    focusMinutesInput.value = data.focusMinutes;
    document.getElementById('themeSelect').value = data.theme;
    document.getElementById('soundscapeSelect').value = data.soundscape;
    document.getElementById('ambientVolumeInput').value = data.ambientVolume;
    document.getElementById('ambientVolumeLabel').textContent = `${data.ambientVolume}%`;
    document.getElementById('breaksEnabledToggle').checked = data.breaksEnabled;
    document.getElementById('breakMinutesInput').value = data.breakMinutes;
    
    applyTheme();
    resetTimer();
    setPage('focus');
}

init();

</script>
</body>
</html>

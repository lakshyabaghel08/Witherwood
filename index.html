<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Witherwood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
@keyframes rainfall {
  from {
    transform: translate3d(0, -120vh, 0) rotate(12deg);
  }
  to {
    transform: translate3d(-120px, 120vh, 0) rotate(12deg);
  }
}
.rain-overlay {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 2147483646;
}
.rain-drop {
  position: absolute;
  top: -20%; 
  width: 4.5px;
  border-radius: 9999px;
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,0),
    rgba(220,238,255,0.95)
  );
  box-shadow: 0 0 7px rgba(180,220,255,0.4);
  animation: rainfall linear infinite;
  will-change: transform;
}

@keyframes shootingStar {
  0% {
    transform: translate3d(0, 0, 0) rotate(25deg);
    opacity: 0;
  }
  8% {
    opacity: 1;
  }
  65% {
    opacity: 1;
  }
  100% {
    transform: translate3d(320px, 180px, 0) rotate(25deg);
    opacity: 0;
  }
}

.night-overlay {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 2147483646;
}

.shooting-star {
  position: absolute;
  width: 140px;
  height: 3px;
  border-radius: 9999px;
  background: linear-gradient(
    to right,
    rgba(255,255,255,0),
    rgba(255,255,255,0.08) 20%,
    rgba(255,255,255,0.35) 55%,
    rgba(255,255,255,0.95) 88%,
    rgba(255,255,255,1) 100%
  );
  box-shadow:
    0 0 6px rgba(255,255,255,0.45),
    0 0 14px rgba(255,255,255,0.65),
    0 0 24px rgba(196,181,253,0.35);
  animation: shootingStar 2.4s ease-out forwards;
}

.shooting-star::after {
  content: '';
  position: absolute;
  right: -1px;
  top: 50%;
  width: 6px;
  height: 6px;
  border-radius: 9999px;
  transform: translateY(-50%);
  background: radial-gradient(circle, rgba(255,255,255,1) 0%, rgba(255,255,255,0.95) 45%, rgba(255,255,255,0) 100%);
  box-shadow:
    0 0 8px rgba(255,255,255,0.9),
    0 0 18px rgba(255,255,255,0.7),
    0 0 30px rgba(196,181,253,0.45);
}

@keyframes leafFloat {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translate(100px, 100vh) rotate(360deg); opacity: 0; }
}

.forest-overlay {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 2147483646;
    overflow: hidden;
}

.falling-leaf {
    position: absolute;
    top: -10%;
    width: 20px;
    height: 20px;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%2322c55e"><path d="M17 8C8 10 5.9 16.17 3.82 21.5L5.71 22L6.66 19.7C7.14 19.87 7.64 20 8 20C19 20 22 3 22 3C21 5 14 5.25 9 6.25C4 7.25 2 11.5 2 13.5C2 15.5 3.75 17.25 3.75 17.25C7 8 17 8 17 8Z"/></svg>');
    background-size: contain;
    background-repeat: no-repeat;
    opacity: 0;
    animation: leafFloat linear forwards;
    will-change: transform, opacity;
}

.brand-title {
  font-family: 'Cinzel', serif;
  letter-spacing: 0.06em;
  font-weight: 700;
  text-shadow:
    0 2px 8px rgba(16, 24, 40, 0.08),
    0 0 20px rgba(16, 185, 129, 0.08);
}

.brand-title-night {
  text-shadow:
    0 2px 10px rgba(0, 0, 0, 0.45),
    0 0 24px rgba(167, 139, 250, 0.22);
}

.brand-title-rain {
  text-shadow:
    0 2px 10px rgba(15, 23, 42, 0.12),
    0 0 24px rgba(14, 165, 233, 0.16);
}

/* Mini Player Styles */
#miniPlayer {
  display: none;
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
  z-index: 2147483647;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: opacity 0.3s ease, transform 0.3s ease;
}

#miniPlayer.hidden-mini {
    opacity: 0;
    pointer-events: none;
    transform: scale(0.8);
}

#miniPlayer.visible-mini {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
}

.mini-ring-container {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.mini-ring-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
}

.mini-ring-bg {
    fill: none;
    stroke: rgba(255, 255, 255, 0.2);
    stroke-width: 6;
}

.mini-ring-progress {
    fill: none;
    stroke: #10b981;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 339.29; /* 2 * pi * 54 */
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 0.25s linear, stroke 0.3s ease;
}

.mini-timer-text {
    font-family: monospace;
    font-size: 1.5rem;
    font-weight: bold;
    z-index: 10;
}

.mini-phase-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 2px;
    z-index: 10;
}

</style>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f7f4ea">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
</head>
<body class="min-h-screen bg-gradient-to-b from-emerald-50 via-lime-50 to-teal-100 text-slate-800 transition-colors duration-500">

<!-- Visual Effects Overlays -->
<div id="rainOverlay" class="rain-overlay hidden"></div>
<div id="nightOverlay" class="night-overlay hidden"></div>
<div id="forestOverlay" class="forest-overlay hidden"></div>

<div class="min-h-screen p-4 md:p-8 pb-10 md:pb-16 transition-colors duration-500">
  <div id="appRoot" class="min-h-[calc(100vh-2rem)] rounded-3xl bg-gradient-to-b from-emerald-50 via-lime-50 to-teal-100 p-6 transition-colors duration-500 relative">
    <div class="w-full max-w-none space-y-6">
      <header class="flex items-start justify-between gap-4 w-full px-1 md:px-2">
        <div class="flex-1 min-w-0">
          <h1 id="brandTitle" class="brand-title text-4xl md:text-6xl transition-colors duration-300">🌲 Witherwood</h1>
          <p class="text-slate-600 mt-2 transition-colors duration-300">Every 10 minutes of focus plants a tree.</p>
        </div>
        <button id="fullscreenBtn" class="px-4 py-3 rounded-2xl border bg-white/85 flex-shrink-0 self-start transition-colors duration-300" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
          ⛶
        </button>
      </header>

      <nav id="nav" class="flex flex-wrap gap-2"></nav>

      <section id="focusPage" class="rounded-3xl bg-white/85 border shadow-lg p-6 max-w-3xl mx-auto mb-8 md:mb-12 lg:mb-16 transition-colors duration-300">
        <div class="max-w-lg mx-auto text-center">
          <div id="phaseLabel" class="text-sm uppercase tracking-wide text-emerald-700 transition-colors duration-300">Focus Session</div>

          <div class="mt-3 flex justify-center">
            <div class="relative w-64 h-64 md:w-72 md:h-72">
              <svg class="w-full h-full -rotate-90" viewBox="0 0 140 140">
                <circle id="progressRingBg" cx="70" cy="70" r="60" fill="none" stroke="#d1fae5" stroke-width="8" class="transition-colors duration-300" />
                <circle
                  id="progressRing"
                  cx="70"
                  cy="70"
                  r="60"
                  fill="none"
                  stroke="#10b981"
                  stroke-width="8"
                  stroke-linecap="round"
                  stroke-dasharray="376.99"
                  stroke-dashoffset="0"
                  class="transition-colors duration-300 transition-[stroke-dashoffset] duration-250 linear"
                />
              </svg>

              <div class="absolute inset-0 flex flex-col items-center justify-center">
                <div id="timer" class="text-6xl md:text-7xl font-mono font-bold transition-colors duration-300">25:00</div>
                <div id="progressLabel" class="mt-2 text-sm text-slate-500 transition-colors duration-300"></div>
              </div>
            </div>
          </div>

          <div id="focusControls" class="mt-4 flex items-center justify-center gap-3">
            <label class="transition-colors duration-300">Focus (min)</label>
            <input
              id="focusMinutesInput"
              type="number"
              min="1"
              max="180"
              value="25"
              class="w-24 rounded-xl border px-3 py-2 transition-colors duration-300"
            />
          </div>

          <div id="saplings" class="mt-4 text-lg font-medium transition-colors duration-300"></div>

          <div class="flex flex-wrap justify-center gap-3 mt-4">
            <button id="startPauseBtn" class="px-5 py-3 rounded-2xl bg-emerald-500 text-white font-semibold transition-all duration-300">Start</button>
            <button id="witherBtn" class="px-5 py-3 rounded-2xl bg-amber-500 text-white font-semibold transition-all duration-300">🍂 Wither Tree</button>
            <button id="resetBtn" class="px-5 py-3 rounded-2xl border bg-white transition-colors duration-300">Reset</button>
          </div>

          <p id="message" class="mt-5 italic text-slate-500 transition-colors duration-300">“A calm mind nurtures strong roots.”</p>
        </div>
      </section>

      <section id="forestPage" class="hidden rounded-3xl bg-white/85 border shadow-lg p-6 transition-colors duration-300">
        <h2 class="text-2xl font-semibold mb-2 transition-colors duration-300">Your Forest</h2>
        <div id="forestSummary" class="text-slate-500 mb-4 transition-colors duration-300"></div>
        <div id="forestGrid" class="flex flex-wrap gap-1 text-xl"></div>
      </section>

      <section id="dashboardPage" class="hidden">
        <div id="dashboardGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      </section>

      <section id="settingsPage" class="hidden rounded-3xl bg-white/85 border shadow-lg p-6 max-w-xl mx-auto space-y-4 transition-colors duration-300">
        <h2 class="text-2xl font-semibold transition-colors duration-300">Settings</h2>

        <!-- Visual Theme Selection -->
        <label class="block">
          <span class="font-medium transition-colors duration-300">Visual Theme</span>
          <select id="themeSelect" class="w-full mt-2 rounded-xl border px-3 py-2 transition-colors duration-300">
            <option value="forest">🌲 Forest</option>
            <option value="night">🌙 Night</option>
            <option value="rain">🌧️ Rain</option>
          </select>
          <p class="text-xs text-slate-500 mt-1">Changes colors and visual effects.</p>
        </label>

        <!-- Soundscape Selection -->
        <label class="block mt-4">
          <span class="font-medium transition-colors duration-300">Soundscape</span>
          <select id="soundscapeSelect" class="w-full mt-2 rounded-xl border px-3 py-2 transition-colors duration-300">
            <option value="woodland">🌲 Woodland</option>
            <option value="rain">🌧️ Rain</option>
            <option value="fireside">🔥 Fireside</option>
          </select>
          <p class="text-xs text-slate-500 mt-1">Changes background audio.</p>
        </label>

        <div class="border-t border-slate-200/60 my-4"></div>

        <label class="flex items-center gap-3">
          <input id="breaksEnabledToggle" type="checkbox" />
          <span class="transition-colors duration-300">Enable Break Sessions</span>
        </label>

        <label class="block">
          <span class="transition-colors duration-300">Break Minutes</span>
          <input
            id="breakMinutesInput"
            type="number"
            min="1"
            max="60"
            value="5"
            class="w-full mt-2 rounded-xl border px-3 py-2 transition-colors duration-300"
          />
        </label>

        <label class="flex items-center gap-3 mt-4">
          <input id="ambientSoundToggle" type="checkbox" />
          <span class="transition-colors duration-300">Enable Audio</span>
        </label>

        <label class="block">
          <div class="flex items-center justify-between">
            <span class="transition-colors duration-300">Audio Volume</span>
            <span id="ambientVolumeLabel" class="text-sm text-slate-500 transition-colors duration-300">50%</span>
          </div>
          <input
            id="ambientVolumeInput"
            type="range"
            min="0"
            max="100"
            step="1"
            value="50"
            class="w-full mt-2"
          />
        </label>

        <div class="pt-4 border-t border-slate-200/60 space-y-3">
          <h3 class="font-semibold transition-colors duration-300">Reset Data</h3>
          <div>
            <button id="resetAllBtn" class="px-4 py-2 rounded-2xl bg-rose-500 text-white hover:bg-rose-600 transition">
              Reset All Data
            </button>
          </div>
          <p class="text-sm text-slate-500">Permanently clears your forest and all saved statistics.</p>
          <div class="pt-2 border-t border-slate-200/60 space-y-3">
            <h3 class="font-semibold transition-colors duration-300">Backup & Restore</h3>
            <div class="flex gap-2 flex-wrap">
              <button id="exportDataBtn" class="px-4 py-2 rounded-2xl bg-emerald-500 text-white hover:bg-emerald-600 transition">
                📤 Export Backup
              </button>
              <button id="importDataBtn" class="px-4 py-2 rounded-2xl bg-sky-500 text-white hover:bg-sky-600 transition">
                📥 Import Backup
              </button>
              <input id="importFileInput" type="file" accept=".json" style="display:none" />
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>

<!-- Mini Player -->
<div id="miniPlayer" class="hidden-mini shadow-xl" aria-label="Return to App" title="Click to maximize">
    <div class="mini-phase-label" id="miniPhaseLabel">Focus</div>
    <div class="mini-timer-text" id="miniTimer">25:00</div>
    <div class="mini-ring-container">
        <svg class="mini-ring-svg" viewBox="0 0 120 120">
            <circle class="mini-ring-bg" cx="60" cy="60" r="54" id="miniRingBg"></circle>
            <circle class="mini-ring-progress" cx="60" cy="60" r="54" id="miniRingProgress"></circle>
        </svg>
    </div>
</div>

<script>
const STORAGE_KEY = 'witherwood-data';
const DEFAULTS = {
  focusMinutes: 25,
  breakMinutes: 5,
  theme: 'forest',
  soundscape: 'woodland',
  ambientSoundEnabled: false,
  ambientVolume: 50,
  livingTrees: 0,
  deadTrees: 0,
  totalFocusMinutes: 0,
  todayFocusMinutes: 0,
  streakDays: 0,
  bestDayMinutes: 0,
  lastFocusDate: '',
  breaksEnabled: true,
};

let data;
try {
  data = { ...DEFAULTS, ...(JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || {}) };
} catch {
  data = { ...DEFAULTS };
}

// Ensure new properties exist for users upgrading
if (!data.soundscape) data.soundscape = 'woodland';

let page = 'focus';
let phase = 'focus';
let isRunning = false;
let intervalId = null;
let secondsLeft = data.focusMinutes * 60;
let healthyTrees = Math.max(1, Math.ceil(data.focusMinutes / 10));

const pages = ['focus', 'forest', 'dashboard', 'settings'];
const labels = {
  focus: '⏱ Focus',
  forest: '🌲 Forest',
  dashboard: '📊 Dashboard',
  settings: '⚙️ Settings',
};

// Theme configurations
const themeConfigs = {
  forest: {
    bg: ['from-emerald-50', 'via-lime-50', 'to-teal-100'],
    textPrimary: 'text-emerald-900',
    textSecondary: 'text-emerald-700',
    cardBg: 'bg-white/85 border shadow-lg',
    ringColor: '#10b981',
    ringBg: '#d1fae5',
    buttonColor: 'bg-emerald-500 hover:bg-emerald-600',
    navActive: 'bg-emerald-500 text-white',
    navInactive: 'bg-white/85 text-slate-800'
  },
  night: {
    bg: ['from-slate-950', 'via-slate-900', 'to-indigo-950'],
    textPrimary: 'text-violet-50 drop-shadow-[0_0_18px_rgba(167,139,250,0.45)]',
    textSecondary: 'text-violet-200',
    cardBg: 'bg-gradient-to-br from-slate-900/92 via-slate-900/88 to-indigo-950/90 border border-indigo-300/20 shadow-2xl backdrop-blur-xl',
    ringColor: '#a78bfa',
    ringBg: 'rgba(167,139,250,0.2)',
    buttonColor: 'bg-gradient-to-r from-indigo-500 via-violet-500 to-fuchsia-500 shadow-xl shadow-violet-900/40 hover:brightness-110',
    navActive: 'border border-violet-400/40 bg-gradient-to-r from-indigo-500 to-violet-500 text-white shadow-lg shadow-violet-900/30',
    navInactive: 'border border-indigo-300/15 bg-slate-900/60 text-slate-200 shadow-sm hover:bg-slate-800/80'
  },
  rain: {
    bg: ['from-sky-100', 'via-slate-200', 'to-blue-300'],
    textPrimary: 'text-slate-800',
    textSecondary: 'text-sky-700',
    cardBg: 'bg-white/85 border border-sky-100 shadow-lg',
    ringColor: '#0ea5e9',
    ringBg: '#bae6fd',
    buttonColor: 'bg-sky-500 hover:bg-sky-600',
    navActive: 'bg-sky-500 text-white',
    navInactive: 'bg-white/90 text-slate-800'
  },
};

function el(id) {
  return document.getElementById(id);
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

let currentThemeEffects = null; // Track current effects for cleanup
let effectTimers = [];

function clearVisualEffects() {
    // Clear all timeouts/intervals related to visual effects
    effectTimers.forEach(clearTimeout);
    effectTimers = [];

    // Hide and clear all overlays
    const overlays = ['rainOverlay', 'nightOverlay', 'forestOverlay'];
    overlays.forEach(id => {
        const overlay = el(id);
        if (overlay) {
            overlay.classList.add('hidden');
            overlay.innerHTML = ''; // Remove all generated DOM elements
        }
    });
    currentThemeEffects = null;
}

function initForestEffects() {
    const overlay = el('forestOverlay');
    if (!overlay) return;
    overlay.classList.remove('hidden');

    function createLeaf() {
        if (data.theme !== 'forest') return;
        const leaf = document.createElement('div');
        leaf.className = 'falling-leaf';
        leaf.style.left = Math.random() * 100 + '%';
        
        // Randomize size and animation
        const size = 15 + Math.random() * 15;
        leaf.style.width = `${size}px`;
        leaf.style.height = `${size}px`;
        leaf.style.animationDuration = 8 + Math.random() * 7 + 's';
        
        // Slight rotation offset
        leaf.style.transform = `rotate(${Math.random() * 360}deg)`;

        overlay.appendChild(leaf);

        effectTimers.push(setTimeout(() => {
            if(leaf.parentNode) leaf.remove();
        }, 16000));

        effectTimers.push(setTimeout(createLeaf, 3000 + Math.random() * 5000));
    }

    // Initial batch
    for(let i=0; i<3; i++) {
        effectTimers.push(setTimeout(createLeaf, Math.random() * 2000));
    }
}

function initNightEffects() {
    const overlay = el('nightOverlay');
    if (!overlay) return;
    overlay.classList.remove('hidden');

    function createStar() {
        if (data.theme !== 'night') return;
        const star = document.createElement('div');
        star.className = 'shooting-star';
        star.style.left = Math.random() * 70 + '%';
        star.style.top = Math.random() * 35 + '%';
        overlay.appendChild(star);

        effectTimers.push(setTimeout(() => {
             if(star.parentNode) star.remove();
        }, 2500));

        effectTimers.push(setTimeout(createStar, 8000 + Math.random() * 15000));
    }

    effectTimers.push(setTimeout(createStar, 3000 + Math.random() * 7000));
}

function initRainEffects() {
    const overlay = el('rainOverlay');
    if (!overlay) return;
    overlay.classList.remove('hidden');

    // Generate static rain drops for CSS animation
    for (let i = 0; i < 140; i++) {
      const drop = document.createElement('div');
      drop.className = 'rain-drop';
      drop.style.left = Math.random() * 100 + '%';
      drop.style.height = 28 + Math.random() * 36 + 'px';
      drop.style.animationDuration = 1.2 + Math.random() * 1.5 + 's'; // Faster rain visual
      drop.style.animationDelay = '-' + Math.random() * 4 + 's';
      drop.style.opacity = 0.2 + Math.random() * 0.3;
      overlay.appendChild(drop);
    }
}

function applyThemeVisuals() {
    const theme = data.theme;
    const isNight = theme === 'night';
    const config = themeConfigs[theme];
    
    if(!config) return;

    // 1. Structural Classes
    document.body.className = `min-h-screen bg-gradient-to-b ${config.bg.join(' ')} ${isNight ? 'text-slate-100' : 'text-slate-800'} transition-colors duration-500`;
    
    const root = el('appRoot');
    if (root) root.className = `min-h-[calc(100vh-2rem)] md:min-h-[calc(100vh-2rem)] rounded-3xl bg-gradient-to-b ${config.bg.join(' ')} p-6 transition-colors duration-500 relative`;

    // 2. Text and SVGs
    const brandTitle = el('brandTitle');
    if (brandTitle) {
        brandTitle.className = `brand-title text-4xl md:text-6xl transition-colors duration-300 ${isNight ? 'brand-title-night text-violet-50' : (theme === 'rain' ? 'brand-title-rain text-slate-800' : 'text-emerald-900')}`;
    }
    
    const timer = el('timer');
    if(timer) timer.className = `text-6xl md:text-7xl font-mono font-bold transition-colors duration-300 ${config.textPrimary}`;
    
    const phaseLabel = el('phaseLabel');
    if(phaseLabel) phaseLabel.className = `text-sm uppercase tracking-wide transition-colors duration-300 ${config.textSecondary}`;

    const ring = el('progressRing');
    if(ring) {
        ring.setAttribute('stroke', config.ringColor);
        ring.style.filter = isNight ? 'drop-shadow(0 0 10px rgba(167,139,250,0.55))' : 'none';
    }
    const ringBg = el('progressRingBg');
    if(ringBg) ringBg.setAttribute('stroke', config.ringBg);

    // Mini Player colors
    const miniRing = el('miniRingProgress');
    if(miniRing) miniRing.setAttribute('stroke', config.ringColor);
    const miniLabel = el('miniPhaseLabel');
    if(miniLabel) miniLabel.style.color = config.ringColor;
    const miniText = el('miniTimer');
    if(miniText) miniText.style.color = isNight ? '#f8fafc' : '#1e293b';

    // 3. Buttons & Inputs
    const startBtn = el('startPauseBtn');
    if(startBtn) startBtn.className = `px-5 py-3 rounded-2xl text-white font-semibold transition-all duration-300 ${config.buttonColor}`;

    // 4. Cards
    const cards = ['focusPage', 'forestPage', 'settingsPage'];
    cards.forEach(id => {
        const c = el(id);
        if(c) {
             const baseClasses = Array.from(c.classList).filter(cls => !cls.startsWith('bg-') && !cls.startsWith('border-') && !cls.startsWith('shadow-') && cls !== 'border');
             c.className = `${baseClasses.join(' ')} ${config.cardBg} transition-colors duration-500`;
        }
    });

    const dashboardCards = document.querySelectorAll('#dashboardGrid > div');
    dashboardCards.forEach(c => {
         c.className = `rounded-3xl p-5 transition-colors duration-500 ${config.cardBg}`;
    });

    // 5. Update Navigation
    renderNav();

    // 6. Handle Visual Effects strictly based on theme
    if (currentThemeEffects !== theme) {
        clearVisualEffects();
        currentThemeEffects = theme;
        
        if (theme === 'forest') initForestEffects();
        else if (theme === 'night') initNightEffects();
        else if (theme === 'rain') initRainEffects();
    }
}

const AUDIO_FILES = {
    woodland: {
        ambience: ['Sounds/AMBIENCE/woodland_01.mp3', 'Sounds/AMBIENCE/woodland_02.mp3'],
        common: ['Sounds/WOODLAND/robin.mp3', 'Sounds/WOODLAND/sparrow.mp3', 'Sounds/WOODLAND/cuckoo.mp3', 'Sounds/WOODLAND/bird_flying.mp3'],
        medium: ['Sounds/WOODLAND/woodpecker.mp3', 'Sounds/WOODLAND/squirrel.mp3', 'Sounds/WOODLAND/gust_wind.mp3'],
        rare: ['Sounds/WOODLAND/owl_01.mp3', 'Sounds/WOODLAND/owl_02.mp3', 'Sounds/WOODLAND/owl_03.mp3']
    },
    rain: {
        ambience: ['Sounds/AMBIENCE/rain_01.mp3', 'Sounds/AMBIENCE/rain_02.mp3'],
        thunder: ['Sounds/RAIN/thunder_01.mp3', 'Sounds/RAIN/thunder_02.mp3', 'Sounds/RAIN/thunder_03.mp3'],
        wind: ['Sounds/WOODLAND/gust_wind.mp3'] // Reusing woodland gust for rain
    },
    fireside: {
        ambience: ['Sounds/AMBIENCE/fireplace_01.mp3', 'Sounds/AMBIENCE/fireplace_02.mp3'],
        woosh: ['Sounds/FIRE/fire_woosh_01.mp3', 'Sounds/FIRE/fire_woosh_02.mp3'],
        owl: ['Sounds/WOODLAND/owl_01.mp3', 'Sounds/WOODLAND/owl_02.mp3', 'Sounds/WOODLAND/owl_03.mp3'] // Reusing woodland owls
    }
};

let audioContext = null;
let masterGain = null;
let currentAmbienceSource = null;
let currentAmbienceBuffer = null;
let audioBuffers = {}; // Simple cache: path -> AudioBuffer
let activeEvents = 0; // Prevent overlapping event sounds
let soundscapeTimers = [];

function getVolume() {
    return Math.max(0, Math.min(1, (data.ambientVolume || 50) / 100));
}

async function initAudio() {
    if (audioContext) return;
    try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioContext = new AudioContext();
        masterGain = audioContext.createGain();
        masterGain.connect(audioContext.destination);
        masterGain.gain.value = getVolume();
    } catch (e) {
        console.warn("Audio initialization failed:", e);
    }
}

function updateAudioVolume() {
    if (masterGain) {
        // Smooth volume change
        masterGain.gain.setTargetAtTime(getVolume(), audioContext.currentTime, 0.1);
    }
}

async function fetchAudioBuffer(path) {
    if (!audioContext) return null;
    if (audioBuffers[path]) return audioBuffers[path];
    
    try {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);
        audioBuffers[path] = audioBuffer;
        return audioBuffer;
    } catch (e) {
        console.warn(`Failed to load audio: ${path}`, e);
        return null;
    }
}

// Crossfade into a new ambience track
async function playAmbienceTrack(soundscapeId) {
    if (!data.ambientSoundEnabled || !audioContext) return;
    
    const paths = AUDIO_FILES[soundscapeId]?.ambience;
    if (!paths || paths.length === 0) return;

    // Pick a track (simple alternating logic could go here, for now random)
    const path = paths[Math.floor(Math.random() * paths.length)];
    const buffer = await fetchAudioBuffer(path);
    if (!buffer) return;

    if (data.soundscape !== soundscapeId || !data.ambientSoundEnabled) return; // State changed during fetch

    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    source.loop = true;

    const gainNode = audioContext.createGain();
    source.connect(gainNode);
    gainNode.connect(masterGain);

    const now = audioContext.currentTime;
    gainNode.gain.setValueAtTime(0, now);
    
    // Crossfade logic
    if (currentAmbienceSource) {
        // Fade out old
        const oldGain = currentAmbienceSource.gainNode;
        oldGain.gain.cancelScheduledValues(now);
        oldGain.gain.linearRampToValueAtTime(0, now + 3);
        const oldSource = currentAmbienceSource.source;
        setTimeout(() => {
            try { oldSource.stop(); } catch(e){}
        }, 3500);
    }

    // Fade in new
    source.start(now);
    gainNode.gain.linearRampToValueAtTime(1, now + 3);

    currentAmbienceSource = { source, gainNode, path };
}

async function playEventSound(pathArray) {
    if (!data.ambientSoundEnabled || !audioContext || pathArray.length === 0) return;
    if (activeEvents > 0) return; // Prevent overlap

    const path = pathArray[Math.floor(Math.random() * pathArray.length)];
    const buffer = await fetchAudioBuffer(path);
    if (!buffer) return;
    if (!data.ambientSoundEnabled) return;

    activeEvents++;
    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    
    // Slight randomization of pan/pitch for variety
    const panNode = audioContext.createStereoPanner ? audioContext.createStereoPanner() : null;
    if(panNode) {
        panNode.pan.value = (Math.random() * 0.8) - 0.4;
        source.connect(panNode);
        panNode.connect(masterGain);
    } else {
        source.connect(masterGain);
    }
    
    source.playbackRate.value = 0.95 + (Math.random() * 0.1);

    source.onended = () => {
        activeEvents = Math.max(0, activeEvents - 1);
    };

    source.start(0);
}

function clearSoundscapeTimers() {
    soundscapeTimers.forEach(clearTimeout);
    soundscapeTimers = [];
}

function scheduleNext(func, minMs, maxMs) {
    const delay = minMs + Math.random() * (maxMs - minMs);
    const timerId = setTimeout(() => {
        // If an event is playing, delay by 10-30s
        if (activeEvents > 0) {
            scheduleNext(func, 10000, 30000);
        } else {
            func();
            scheduleNext(func, minMs, maxMs); // Reschedule
        }
    }, delay);
    soundscapeTimers.push(timerId);
}

function startSoundscapeLogic() {
    clearSoundscapeTimers();
    if (!data.ambientSoundEnabled || !audioContext) return;

    const s = data.soundscape;
    
    if (s === 'woodland') {
        // Common: 2-6 mins
        let commonCount = 0;
        let mediumCount = 0;
        
        const doCommon = () => {
            playEventSound(AUDIO_FILES.woodland.common);
            commonCount++;
            if (commonCount >= (2 + Math.floor(Math.random()*2))) { // after 2-3
                commonCount = 0;
                // Schedule medium shortly after
                setTimeout(doMedium, 5000 + Math.random() * 15000);
            }
        };
        
        const doMedium = () => {
             playEventSound(AUDIO_FILES.woodland.medium);
             mediumCount++;
             if (mediumCount >= (2 + Math.floor(Math.random()*2))) { // after 2-3
                 mediumCount = 0;
                 setTimeout(doRare, 5000 + Math.random() * 20000);
             }
        };

        const doRare = () => {
            playEventSound(AUDIO_FILES.woodland.rare);
        };

        scheduleNext(doCommon, 120000, 360000); // 2-6 mins
    } 
    else if (s === 'rain') {
        // Thunder: 7-10 mins
        scheduleNext(() => playEventSound(AUDIO_FILES.rain.thunder), 420000, 600000);
        // Wind: 12-15 mins
        scheduleNext(() => playEventSound(AUDIO_FILES.rain.wind), 720000, 900000);
    }
    else if (s === 'fireside') {
        // Fire woosh: 4-8 mins
        scheduleNext(() => playEventSound(AUDIO_FILES.fireside.woosh), 240000, 480000);
        // Owl: 20-35 mins
        scheduleNext(() => playEventSound(AUDIO_FILES.fireside.owl), 1200000, 2100000);
    }
}

function handleAudioState() {
    if (!data.ambientSoundEnabled) {
        if (currentAmbienceSource) {
            const oldSource = currentAmbienceSource.source;
            const oldGain = currentAmbienceSource.gainNode;
            oldGain.gain.linearRampToValueAtTime(0, audioContext.currentTime + 1);
            setTimeout(() => { try { oldSource.stop(); } catch(e){} }, 1100);
            currentAmbienceSource = null;
        }
        clearSoundscapeTimers();
        if(audioContext && audioContext.state === 'running') {
            // We don't suspend the whole context so UI sounds (if added later) could play
        }
        return;
    }

    if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
    }

    updateAudioVolume();

    // Check if we need to switch ambience
    if (!currentAmbienceSource || !currentAmbienceSource.path.includes(data.soundscape)) {
        playAmbienceTrack(data.soundscape);
        startSoundscapeLogic();
    }
}

// Background Audio behavior is inherently handled by Web Audio API unless the browser explicitly suspends it.
// We removed visibilitychange pausing logic to allow background play.

function exportBackup() {
  const backup = {
    version: 1,
    exportedAt: new Date().toISOString(),
    data
  };

  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `Witherwood_Backup_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const backup = JSON.parse(reader.result);
      if (!backup.data) throw new Error('Invalid backup');
      data = { ...DEFAULTS, ...backup.data };
      save();
      resetTimer();
      render();
      alert('Backup restored successfully!');
    } catch (e) {
      alert('Invalid backup file.');
    }
  };
  reader.readAsText(file);
}

function fmt(seconds) {
  return String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
}

function getIcons() {
  if (data.theme === 'rain') return { sapling: '💧', living: '💧', dead: '☁️' };
  if (data.theme === 'night') return { sapling: '⭐', living: '⭐', dead: '🌑' };
  return { sapling: '🌱', living: '🌲', dead: '🪵' };
}

function setMessage(text) {
  const message = el('message');
  if (message) message.textContent = `“${text}”`;
}

function witherTree() {
  if (!isRunning || phase !== 'focus') return;
  healthyTrees = Math.max(0, healthyTrees - 1);
  data.deadTrees += 1;
  save();
  setMessage('A gust passed through your forest.');
  render();
}

function renderNav() {
  const nav = el('nav');
  if (!nav) return;

  const config = themeConfigs[data.theme] || themeConfigs.forest;
  const isNight = data.theme === 'night';

  nav.innerHTML = '';
  for (const p of pages) {
    const button = document.createElement('button');
    
    if (page === p) {
        button.className = `px-4 py-2 rounded-2xl transition-colors duration-300 ${config.navActive}`;
    } else {
        button.className = `px-4 py-2 rounded-2xl transition-colors duration-300 ${config.navInactive}`;
    }
    
    button.textContent = labels[p];
    button.onclick = () => {
      page = p;
      render();
    };
    nav.appendChild(button);
  }
}

// Mini player logic
function updateMiniPlayer() {
    const miniPlayer = el('miniPlayer');
    if (!miniPlayer) return;

    // Show if timer is running and we are NOT on the focus page
    if (isRunning && page !== 'focus') {
        miniPlayer.classList.remove('hidden-mini');
        miniPlayer.classList.add('visible-mini');
    } else {
        miniPlayer.classList.remove('visible-mini');
        miniPlayer.classList.add('hidden-mini');
    }

    const total = (phase === 'focus' ? data.focusMinutes : data.breakMinutes) * 60;
    const circumference = 339.29; // Matches CSS
    const offset = circumference * (1 - secondsLeft / Math.max(1, total));
    
    el('miniTimer').textContent = fmt(secondsLeft);
    el('miniPhaseLabel').textContent = phase;
    el('miniRingProgress').style.strokeDashoffset = offset;
}

function renderFocus() {
  const icons = getIcons();

  if (el('phaseLabel')) el('phaseLabel').textContent = phase === 'focus' ? 'Focus Session' : 'Break Time';
  if (el('timer')) el('timer').textContent = fmt(secondsLeft);
  if (el('saplings')) el('saplings').textContent = `${icons.sapling} ${healthyTrees} saplings`;
  if (el('progressLabel')) el('progressLabel').textContent = `${icons.sapling} ${healthyTrees} saplings to protect`;
  if (el('startPauseBtn')) el('startPauseBtn').textContent = isRunning ? 'Pause' : 'Start';

  const controls = el('focusControls');
  if (controls) controls.style.display = !isRunning && phase === 'focus' ? 'flex' : 'none';

  const ring = el('progressRing');
  if (ring) {
    const total = (phase === 'focus' ? data.focusMinutes : data.breakMinutes) * 60;
    const circumference = 376.99;
    ring.style.strokeDashoffset = circumference * (1 - secondsLeft / Math.max(1, total));
  }
}

function getForestLevel() {
  const hours = data.todayFocusMinutes / 60;
  if (hours < 1) return '🌱 Sapling Grove';
  if (hours < 2) return '🌿 Young Woodland';
  if (hours < 3.5) return '🌳 Flourishing Forest';
  if (hours < 5) return '🦉 Ancient Canopy';
  if (hours < 6.5) return '🍄 Enchanted Wilds';
  if (hours < 8) return '👑 Mythic Witherwood';
  return '☀️ Zenith of Stillness';
}

function getLocalDateString() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function updateDailyStats(minutes) {
  const today = getLocalDateString();
  if (data.lastFocusDate !== today) {
    if (!data.lastFocusDate) {
      data.streakDays = 1;
    } else {
      const prev = new Date(data.lastFocusDate + 'T00:00:00');
      const curr = new Date(today + 'T00:00:00');
      const diffDays = Math.round((curr - prev) / 86400000);
      if (diffDays === 1) data.streakDays = Math.max(1, data.streakDays + 1);
      else data.streakDays = 1;
    }
    data.todayFocusMinutes = 0;
    data.lastFocusDate = today;
  }
  data.todayFocusMinutes += minutes;
  data.bestDayMinutes = Math.max(data.bestDayMinutes, data.todayFocusMinutes);
}

function renderForest() {
  const icons = getIcons();
  if (el('forestSummary')) {
    el('forestSummary').textContent = `${data.livingTrees} living trees • ${data.deadTrees} withered trees • ${getForestLevel()}`;
  }
  const grid = el('forestGrid');
  if (!grid) return;
  grid.innerHTML = '';
  for (let i = 0; i < Math.min(120, data.livingTrees); i++) {
    const span = document.createElement('span');
    span.textContent = icons.living;
    grid.appendChild(span);
  }
  for (let i = 0; i < Math.min(30, data.deadTrees); i++) {
    const span = document.createElement('span');
    span.textContent = icons.dead;
    span.className = 'opacity-50';
    grid.appendChild(span);
  }
}

function renderDashboard() {
  const grid = el('dashboardGrid');
  if (!grid) return;
  grid.innerHTML = `
    <div><div class="text-sm uppercase opacity-70">Forest Level</div><div class="text-2xl font-bold mt-2">${getForestLevel()}</div></div>
    <div><div class="text-sm uppercase opacity-70">Today's Focus</div><div class="text-3xl font-bold mt-2">${(data.todayFocusMinutes / 60).toFixed(1)}h</div></div>
    <div><div class="text-sm uppercase opacity-70">Day Streak</div><div class="text-3xl font-bold mt-2">${data.streakDays}</div></div>
    <div><div class="text-sm uppercase opacity-70">Living Trees</div><div class="text-3xl font-bold mt-2">${data.livingTrees}</div></div>
    <div><div class="text-sm uppercase opacity-70">Withered Trees</div><div class="text-3xl font-bold mt-2">${data.deadTrees}</div></div>
    <div><div class="text-sm uppercase opacity-70">Total Focus</div><div class="text-3xl font-bold mt-2">${(data.totalFocusMinutes / 60).toFixed(1)}h</div></div>
  `;
}

function render() {
  applyThemeVisuals();
  renderFocus();
  renderForest();
  renderDashboard();
  updateMiniPlayer();

  for (const p of pages) {
    const section = el(p + 'Page');
    if (section) section.classList.toggle('hidden', page !== p);
  }

  // Update inputs
  if (el('focusMinutesInput')) el('focusMinutesInput').value = data.focusMinutes;
  if (el('breakMinutesInput')) el('breakMinutesInput').value = data.breakMinutes;
  if (el('breaksEnabledToggle')) el('breaksEnabledToggle').checked = data.breaksEnabled;
  if (el('themeSelect')) el('themeSelect').value = data.theme;
  if (el('soundscapeSelect')) el('soundscapeSelect').value = data.soundscape;
  if (el('ambientSoundToggle')) el('ambientSoundToggle').checked = data.ambientSoundEnabled;
  if (el('ambientVolumeInput')) el('ambientVolumeInput').value = data.ambientVolume ?? 50;
  if (el('ambientVolumeLabel')) el('ambientVolumeLabel').textContent = `${data.ambientVolume ?? 50}%`;
  
  if (el('fullscreenBtn')) {
    el('fullscreenBtn').textContent = '⛶';
    el('fullscreenBtn').title = document.fullscreenElement ? 'Exit Fullscreen' : 'Enter Fullscreen';
  }
}

function startTimer() {
  if (isRunning) return;
  
  initAudio().then(() => {
      handleAudioState();
  });

  isRunning = true;
  const endTimestamp = Date.now() + secondsLeft * 1000;

  intervalId = setInterval(() => {
    secondsLeft = Math.max(0, Math.round((endTimestamp - Date.now()) / 1000));

    if (secondsLeft <= 0) {
      clearInterval(intervalId);
      intervalId = null;
      isRunning = false;

      if (phase === 'focus') {
        data.livingTrees += healthyTrees;
        data.totalFocusMinutes += data.focusMinutes;
        updateDailyStats(data.focusMinutes);
        save(); 

        if (data.breaksEnabled) {
          phase = 'break';
          secondsLeft = data.breakMinutes * 60;
          setMessage('Your forest grew peacefully today.');
        } else {
          phase = 'focus';
          healthyTrees = Math.max(1, Math.ceil(data.focusMinutes / 10));
          secondsLeft = data.focusMinutes * 60;
          setMessage('New saplings are ready to grow.');
        }
      } else {
        phase = 'focus';
        healthyTrees = Math.max(1, Math.ceil(data.focusMinutes / 10));
        secondsLeft = data.focusMinutes * 60;
        setMessage('New saplings are ready to grow.');
      }
    }
    render(); 
  }, 250);
  render();
}

function pauseTimer() {
  isRunning = false;
  clearInterval(intervalId);
  render();
}

function resetAllData() {
  if (!confirm('Reset ALL saved data? This will permanently remove your forest and all statistics.')) return;
  const { theme, soundscape, ambientSoundEnabled, ambientVolume, focusMinutes, breakMinutes, breaksEnabled } = data;
  data = { ...DEFAULTS, theme, soundscape, ambientSoundEnabled, ambientVolume, focusMinutes, breakMinutes, breaksEnabled };
  save(); 
  resetTimer();
  page = 'focus';
  setMessage('A new forest begins.');
  render();
}

function resetTimer() {
  pauseTimer();
  phase = 'focus';
  healthyTrees = Math.max(1, Math.ceil(data.focusMinutes / 10));
  secondsLeft = data.focusMinutes * 60;
  setMessage('A calm mind nurtures strong roots.');
  render();
}

function bindEvents() {
  el('startPauseBtn')?.addEventListener('click', () => isRunning ? pauseTimer() : startTimer());
  el('witherBtn')?.addEventListener('click', witherTree);
  el('resetBtn')?.addEventListener('click', resetTimer);
  el('resetAllBtn')?.addEventListener('click', resetAllData);
  
  el('miniPlayer')?.addEventListener('click', () => {
      page = 'focus';
      render();
  });

  el('focusMinutesInput')?.addEventListener('input', (e) => {
    const value = e.target.value.trim();
    if (value === '') return;
    const parsed = Number(value);
    if (!Number.isFinite(parsed)) return;
    data.focusMinutes = Math.max(1, Math.min(180, parsed));
    healthyTrees = Math.max(1, Math.ceil(data.focusMinutes / 10));
    if (!isRunning && phase === 'focus') secondsLeft = data.focusMinutes * 60;
    save();
    render();
  });

  el('focusMinutesInput')?.addEventListener('blur', (e) => {
    if (e.target.value.trim() === '') e.target.value = data.focusMinutes;
  });

  el('breakMinutesInput')?.addEventListener('input', (e) => {
    const value = e.target.value.trim();
    if (value === '') return;
    const parsed = Number(value);
    if (!Number.isFinite(parsed)) return;
    data.breakMinutes = Math.max(1, Math.min(60, parsed));
    save();
    render();
  });

  el('breakMinutesInput')?.addEventListener('blur', (e) => {
    if (e.target.value.trim() === '') e.target.value = data.breakMinutes;
  });

  el('breaksEnabledToggle')?.addEventListener('change', (e) => {
    data.breaksEnabled = e.target.checked;
    save();
    render();
  });

  el('themeSelect')?.addEventListener('change', (e) => {
    data.theme = e.target.value;
    save();
    render(); // applyThemeVisuals handles the clean switch
  });

  el('soundscapeSelect')?.addEventListener('change', (e) => {
      data.soundscape = e.target.value;
      save();
      handleAudioState();
  });

  el('ambientSoundToggle')?.addEventListener('change', (e) => {
    data.ambientSoundEnabled = e.target.checked;
    save();
    if (data.ambientSoundEnabled) {
        initAudio().then(() => handleAudioState());
    } else {
        handleAudioState();
    }
    render();
  });

  el('ambientVolumeInput')?.addEventListener('input', (e) => {
    data.ambientVolume = Math.max(0, Math.min(100, Number(e.target.value) || 0));
    save();
    updateAudioVolume();
    render();
  });

  el('fullscreenBtn')?.addEventListener('click', async () => {
    const root = el('appRoot');
    if (!root) return;
    if (!document.fullscreenElement) await root.requestFullscreen().catch(() => {});
    else await document.exitFullscreen().catch(() => {});
    render();
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && isRunning && phase === 'focus') {
      e.preventDefault();
      witherTree();
    }
  });
  
  el('exportDataBtn')?.addEventListener('click', exportBackup);
  el('importDataBtn')?.addEventListener('click', () => el('importFileInput')?.click());
  el('importFileInput')?.addEventListener('change', (e) => {
    const file = e.target.files?.[0];
    if (file) importBackup(file);
  });

  document.addEventListener('fullscreenchange', render);
}

// Initial setup
bindEvents();
render();
if (data.ambientSoundEnabled) {
    // Only init if user interacts to bypass autoplay restrictions if loaded directly
    document.body.addEventListener('click', () => {
        initAudio().then(() => handleAudioState());
    }, { once: true });
}
